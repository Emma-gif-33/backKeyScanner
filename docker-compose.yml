services:
  postgres:
    image: postgres:16-alpine
    container_name: keyscanner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyscanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyscanner_password}
      POSTGRES_DB: ${POSTGRES_DB:-keyscanner_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyscanner_user} -d ${POSTGRES_DB:-keyscanner_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
